[package]
name = "speeching"
version = "2.0.0"
edition = "2021"
rust-version = "1.95"
description = "Native speech-to-speech language practice"

[dependencies]
base64 = "0.22"
cpal = "0.16"
dirs = "6"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
futures-util = { version = "0.3", features = ["sink"] }
libsonic = "0.1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
